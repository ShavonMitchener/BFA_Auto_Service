<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALL COUNTY AUTO - Invoice</title>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="invoice-container">
  <!-- ===== HEADER SECTION ===== -->
  <div class="header">
    <h2>ALL COUNTY AUTO</h2>
    <p>2401 NW 19TH STREET FORT LAUDERDALE FL 33311</p>
    <p>Tel: 954-274-6948</p>
    <div class="logos">
      <img src="toyota.png" alt="Toyota">
      <img src="mercedes.png" alt="Mercedes">
      <img src="honda.png" alt="Honda">
      <img src="bmw.png" alt="BMW">
      <img src="lexus.png" alt="Lexus">
    </div>
  </div>

  <!-- ===== DIVIDER LINE ===== -->
  <hr class="section-divider">

  <!-- ===== INVOICE NUMBER, DATE, DUE DATE ===== -->
  <div class="invoice-top">
    <div class="invoice-field">
      <label>Invoice #:</label>
      <input type="text" id="invoiceNo" value="001">
    </div>
    <div class="invoice-field">
      <label>Date:</label>
      <span id="date"></span>
    </div>
    <div class="invoice-field">
      <label>Due Date:</label>
      <input type="date" id="dueDate">
    </div>
  </div>

  <!-- ===== DIVIDER LINE ===== -->
  <hr class="section-divider">

  <!-- ===== BILL TO ===== -->
  <div class="section-title-bold">Bill To</div>
  <div class="bill-to">
    <div><label>Customer Name:</label> <textarea id="custName" placeholder="Enter name" rows="1"></textarea></div>
    <div><label>Phone:</label> <input type="text" id="phone" placeholder="Enter phone" style="width:100%"></div>
    <div><label>Address:</label> <textarea id="address" placeholder="Enter address" rows="1"></textarea></div>
    <div><label>City/State/Zip:</label> <textarea id="cityStateZip" placeholder="Enter city, state, zip" rows="1"></textarea></div>
  </div>

  <!-- ===== DIVIDER LINE ===== -->
  <hr class="section-divider">

  <!-- ===== VEHICLE INFORMATION ===== -->
  <div class="section-title-bold">Vehicle Information</div>
  <div class="vehicle-info-grid">
    <div><label>Model:</label> <input type="text" id="vehicleModel" placeholder="Model" style="width:100%"></div>
    <div><label>License Plate:</label> <input type="text" id="licensePlate" placeholder="License plate" style="width:100%"></div>
    <div><label>Make:</label> <input type="text" id="vehicleMake" placeholder="Make" style="width:100%"></div>
    <div><label>VIN:</label> <input type="text" id="vehicleVin" placeholder="VIN" style="width:100%"></div>
    <div><label>Year:</label> <input type="text" id="vehicleYear" placeholder="Year" style="width:100%"></div>
    <div><label>Mileage:</label> <input type="text" id="vehicleMileage" placeholder="Mileage" style="width:100%"></div>
    <div><label>Color:</label> <input type="text" id="vehicleColor" placeholder="Color" style="width:100%"></div>
    <div><label>RO / Job #:</label> <input type="text" id="jobNumber" placeholder="RO / Job #" style="width:100%"></div>
  </div>

  <!-- ===== DIVIDER LINE ===== -->
  <hr class="section-divider">

  <!-- ===== ITEMS TABLE ===== -->
  <table class="items" id="partsTable">
    <thead>
      <tr>
        <th>DESCRIPTION</th>
        <th>QTY</th>
        <th>RATE</th>
        <th>AMOUNT</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="partsBody"></tbody>
  </table>
  <button id="addPart">+ Add Item</button>

  <!-- ===== DIVIDER LINE ===== -->
  <hr class="section-divider">

  <!-- ===== TOTALS SECTION ===== -->
  <div class="totals">
    <div class="parts-total">Subtotal: $<span id="partsTotal">0.00</span></div>
    <div class="tax">TAX (7%): $<span id="taxAmount">0.00</span></div>
    <div class="deposit-section" id="depositSection">
      <label>DEPOSIT: $</label>
      <input type="number" id="depositAmount" min="0" step="0.01" value="0.00">
    </div>
    <div class="grand">TOTAL DUE: $<span id="grandTotal">0.00</span></div>
  </div>

  <!-- ===== PAYMENT & NOTES ===== -->
  <div class="payment-notes-row">
    <div class="payment-method">
      <label>Payment Method:</label>
      <input type="text" id="paymentMethod" placeholder="Cash, Check, Credit Card" style="width:100%">
    </div>
    <div class="notes">
      <label>Notes:</label>
      <textarea id="notes" placeholder="Additional notes" rows="2"></textarea>
    </div>
  </div>

  <!-- ===== AUTHORIZATION ===== -->
  <div class="auth-row">
    <div class="auth-signature">
      <label>AUTHORIZED BY</label>
      <div class="signature-line">
        <label>Signature:</label>
        <input type="text" id="signedBy" placeholder="Enter signature" style="width:70%">
      </div>
      <div class="date-line">
        <label>Date:</label>
        <input type="date" id="authDate">
      </div>
    </div>
  </div>

  <!-- ===== DIVIDER LINE ===== -->
  <hr class="section-divider">

  <!-- ===== ACTIONS ===== -->
  <div class="actions">
    <button id="saveBtn">Save Receipt</button>
    <button id="printBtn">Print Invoice</button>
    <button id="newBtn">New Invoice</button>
    <button id="resetBtn">Reset Invoice No.</button>
    <button id="exportBtn">📁 Export Receipts</button>
    <button id="importBtn">📂 Import Receipts</button>
  </div>
</div>

<!-- ===== SEARCH CONTAINER ===== -->
<div class="search-container">
  <h3>Search Old Receipts</h3>
  <textarea id="searchInput" placeholder="Enter invoice number or customer name" rows="1"></textarea>
  <button id="searchBtn">Search</button>
  <div id="searchResults"></div>
</div>

<input type="file" id="importFile" style="display:none" accept=".json">

<script src="script.js"></script>
</body>
</html>
