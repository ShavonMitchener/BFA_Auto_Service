<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALL COUNTY AUTO - Invoice</title>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="invoice-container">
  <!-- ===== HEADER SECTION ===== -->
  <div class="header">
    <h2>ALL COUNTY AUTO</h2>
    <p>2401 NW 19TH STREET FORT LAUDERDALE FL 33311</p>
    <p>Tel: 954-274-6948</p>
    <div class="logos">
      <img src="toyota.png" alt="Toyota">
      <img src="mercedes.png" alt="Mercedes">
      <img src="honda.png" alt="Honda">
      <img src="bmw.png" alt="BMW">
      <img src="lexus.png" alt="Lexus">
    </div>
  </div>

  <!-- ===== DIVIDER LINE ===== -->
  <hr class="section-divider">

  <!-- ===== INFO SECTION ===== -->
  <div class="info">
    <div class="info-left">
      <div><label>Invoice No:</label> <input type="text" id="invoiceNo" value="001"></div>
      <div><label>Customer Name:</label> <textarea id="custName" placeholder="Enter name" rows="1"></textarea></div>
      <div><label>From:</label> <textarea id="fromName" placeholder="Staff name" rows="1"></textarea></div>
    </div>
    <div class="info-right">
      <div><label>Date:</label> <span id="date"></span></div>
    </div>
  </div>

  <!-- ===== DIVIDER LINE ===== -->
  <hr class="section-divider">

  <!-- ===== VEHICLE INFORMATION SECTION ===== -->
  <h3>Vehicle Information</h3>
  <div class="vehicle-info">
    <div class="vehicle-left">
      <div><label>Model:</label> <textarea id="vehicleModel" placeholder="Enter model" rows="1"></textarea></div>
      <div><label>Year:</label> <textarea id="vehicleYear" placeholder="Enter year" rows="1"></textarea></div>
    </div>
    <div class="vehicle-right">
      <div><label>Color:</label> <textarea id="vehicleColor" placeholder="Enter color" rows="1"></textarea></div>
      <div><label>VIN #:</label> <textarea id="vehicleVin" placeholder="Enter VIN number" rows="1"></textarea></div>
    </div>
  </div>

  <!-- ===== DIVIDER LINE ===== -->
  <hr class="section-divider">

  <!-- ===== PARTS SECTION ===== -->
  <h3>Parts</h3>
  <table class="items" id="partsTable">
    <thead>
      <tr>
        <th>DESCRIPTION</th>
        <th>AMOUNT</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="partsBody"></tbody>
  </table>
  <button id="addPart">+ Add Part</button>

  <!-- ===== DIVIDER LINE ===== -->
  <hr class="section-divider">

  <!-- ===== TOTALS SECTION ===== -->
  <div class="totals">
    <div class="parts-total">Parts Total: $<span id="partsTotal">0.00</span></div>
    <div class="labour-total">
      Labor Total: $<input type="number" id="labourTotalInput" min="0" step="0.01" value="0.00" class="labour-input">
    </div>
    <div class="subtotal">SUBTOTAL: $<span id="subtotal">0.00</span></div>
    <div class="tax">TAX (7%): $<span id="taxAmount">0.00</span></div>
    <div class="deposit-section" id="depositSection">
      <label>DEPOSIT: $</label>
      <input type="number" id="depositAmount" min="0" step="0.01" value="0.00">
    </div>
    <div class="grand">GRAND TOTAL: $<span id="grandTotal">0.00</span></div>
  </div>

  <!-- ===== DIVIDER LINE ===== -->
  <hr class="section-divider">

  <div class="sign">
    <label>Signed by:</label>
    <textarea id="signedBy" placeholder="Enter name" rows="1"></textarea>
  </div>

  <!-- ===== DIVIDER LINE ===== -->
  <hr class="section-divider">

  <div class="actions">
    <button id="saveBtn">Save Receipt</button>
    <button id="printBtn">Print Invoice</button>
    <button id="newBtn">New Invoice</button>
    <button id="resetBtn">Reset Invoice No.</button>
    <button id="exportBtn">📁 Export Receipts</button>
    <button id="importBtn">📂 Import Receipts</button>
  </div>
</div>

<div class="search-container">
  <h3>Search Old Receipts</h3>
  <textarea id="searchInput" placeholder="Enter invoice number or customer name" rows="1"></textarea>
  <button id="searchBtn">Search</button>
  <div id="searchResults"></div>
</div>

<input type="file" id="importFile" style="display:none" accept=".json">

<script src="script.js"></script>
</body>
</html>
